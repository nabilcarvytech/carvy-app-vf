name: carvy
description: >
  Introducing carvy, your go-to app for effortless car and bike rentals. 
  Connect directly with vehicle owners, streamline your rental process, and enhance your 
  experience with easy feedback options.
  **Features:**
  * **Quick Booking**: Search and reserve cars and bikes with minimal effort.
  * **Direct Owner Communication**: Interact with vehicle owners to get all necessary details.
  * **Rate and Review**: Leave feedback to guide other users and improve the service.
  * **Become a Lender**: List your own vehicle for rent and earn by sharing.
  * **User-Friendly Design**: Navigate through a clean and intuitive interface.
  Discover the convenience and flexibility of carvy—download the app and start your journey today"
publish_to: 'none' 

